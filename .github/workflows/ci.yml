name: CI Pipeline concurrency: 

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
        - name: Baixar códigos
        uses: actions/checkout@v4

        - name: instalar dependências 
        run: npm install

        - name: rodar testes
          run: npm test
